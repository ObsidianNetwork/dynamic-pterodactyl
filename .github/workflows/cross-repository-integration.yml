name: Cross-repository integration

on:
  pull_request:
  push:
    branches:
      - dynamic-slider
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-pterodactyl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-sqlite:
    name: PHP ${{ matrix.php }} / SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'

    steps:
      - name: Check out Dynamic Pterodactyl
        uses: actions/checkout@v4
        with:
          path: dynamic-pterodactyl

      - name: Check out companion Paymenter
        uses: actions/checkout@v4
        with:
          repository: ObsidianNetwork/Paymenter-Obsidian-Network
          ref: codex/paymenter-1.5.6-remediation
          path: paymenter

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install Paymenter dependencies
        working-directory: paymenter
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Assemble extension checkout
        run: |
          mkdir -p paymenter/extensions/Others/DynamicPterodactyl
          rsync -a \
            --exclude=.git \
            --exclude=.github \
            dynamic-pterodactyl/ \
            paymenter/extensions/Others/DynamicPterodactyl/

      - name: Prepare SQLite test database
        working-directory: paymenter
        env:
          APP_ENV: testing
          CACHE_STORE: array
          DB_CONNECTION: sqlite
          DB_DATABASE: database/paymenter_test.sqlite
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: |
          cp .env.example .env
          touch database/paymenter_test.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          php artisan migrate \
            --path=extensions/Others/DynamicPterodactyl/database/migrations \
            --force

      - name: Run Dynamic Pterodactyl tests on SQLite
        working-directory: paymenter
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/paymenter_test.sqlite
        run: vendor/bin/phpunit -c extensions/Others/DynamicPterodactyl/phpunit.xml

      - name: Run Paymenter provisioning seam tests on SQLite
        working-directory: paymenter
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/paymenter_test.sqlite
        run: vendor/bin/phpunit tests/Unit/PterodactylReservationIntegrationTest.php

  extension:
    name: PHP ${{ matrix.php }} / MariaDB ${{ matrix.mariadb }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
        mariadb:
          - '11'
          - '12'

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: paymenter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Check out Dynamic Pterodactyl
        uses: actions/checkout@v4
        with:
          path: dynamic-pterodactyl

      - name: Check out companion Paymenter
        uses: actions/checkout@v4
        with:
          repository: ObsidianNetwork/Paymenter-Obsidian-Network
          ref: codex/paymenter-1.5.6-remediation
          path: paymenter

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install Paymenter dependencies
        working-directory: paymenter
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Assemble extension checkout
        run: |
          mkdir -p paymenter/extensions/Others/DynamicPterodactyl
          rsync -a \
            --exclude=.git \
            --exclude=.github \
            dynamic-pterodactyl/ \
            paymenter/extensions/Others/DynamicPterodactyl/

      - name: Prepare test database
        working-directory: paymenter
        env:
          APP_ENV: testing
          CACHE_STORE: array
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: paymenter_test
          DB_USERNAME: root
          DB_PASSWORD: password
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          php artisan migrate \
            --path=extensions/Others/DynamicPterodactyl/database/migrations \
            --force

      - name: Run Dynamic Pterodactyl tests
        working-directory: paymenter
        env:
          APP_ENV: testing
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: paymenter_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: vendor/bin/phpunit -c extensions/Others/DynamicPterodactyl/phpunit.xml

      - name: Run Paymenter provisioning seam tests
        working-directory: paymenter
        env:
          APP_ENV: testing
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: paymenter_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: vendor/bin/phpunit tests/Unit/PterodactylReservationIntegrationTest.php
